<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>투포켓 - 주머니는 각자 따로, 관리는 같이!</title>
  <link rel="stylesheet" href="./style.css">
  
  <!-- Firebase Core SDK 및 Firestore CDN 로드 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>
<body>
  <!-- 모바일 1인 기기 뷰포트 구조 -->
  <div class="mobile-app-container">
    <!-- 상단 헤더 -->
    <header class="app-header">
      <h1 class="logo-text paperlogy-title">투포켓</h1>
      <span class="user-role-badge" id="app-role-badge">로컬 모드</span>
    </header>

    <!-- 메인 대시보드 영역 (동적 렌더링) -->
    <main class="app-main-content" id="app-viewport">
      <div style="text-align: center; padding: 50px 20px; color: var(--color-text-muted);">
        투포켓을 불러오는 중...
      </div>
    </main>

    <!-- 하단 고정 네비게이션 바 -->
    <nav class="app-nav-bar" id="app-bottom-nav" style="display: none;">
      <button class="nav-btn active" data-tab="home">
        <span class="nav-icon">🏠</span>
        <span class="nav-text">홈</span>
      </button>
      <button class="nav-btn" data-tab="assets">
        <span class="nav-icon">👛</span>
        <span class="nav-text">자산</span>
      </button>
      <button class="nav-btn" data-tab="txs">
        <span class="nav-icon">📝</span>
        <span class="nav-text">기록</span>
      </button>
      <button class="nav-btn" data-tab="my">
        <span class="nav-icon">⚙️</span>
        <span class="nav-text">마이</span>
      </button>
    </nav>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
